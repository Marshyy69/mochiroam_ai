name: mochiroam_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dash_chat_2: ^0.0.21
  flutter_markdown_plus: ^1.0.6
  flutter_dotenv: ^6.0.0

  # HTTP & API
  http: ^1.6.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0

  # UI & Utilities
  google_fonts: ^6.3.3
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  google_generative_ai: ^0.4.7
  package_info_plus: ^9.0.1
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/icons/
